<!DOCTYPE html>

<html>
    <head>
        <title>Darknet Metrics Experiment</title>
        <style>
        body {
            background-color: #1e1e2e;
        }

        #button {
            background-color: #cba6f7;
            padding: 5rem;
            max-width: 50vw;
            max-height: 25vh;
            aspect-ratio: 1;
            border-radius: 100%;

            position: fixed;
            left: 50%; top: 50%;

            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #181825;
            font-size: 100px;
            transition: 0.3s ease-in-out;

            box-sizing: border-box;

            box-shadow: -20px 20px 0px #181825;
        }

        #button:hover {
            background-color: #f5c2e7;
            transform: translate(-50%, -50%) scale(0.96);
            box-shadow: 0px 0px 0px #181825;
        }

        #metrics {
            position: fixed;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);

            padding: 20px;
            text-align: center;
            background-color: #313244;
            margin-top: 15px;
            border-radius: 20px;

            font-size: 32px;
            color: #7f849c;
        }
        </style>
        <meta http-equiv="refresh" content="30">
    </head>

    <body>
        <div id="metrics"><u>Total Visitors</u><br>{{visits}}</div>
        <a href="/click"><div id="button">{{clicks}}</div></a>
    </body>
</html>
